name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
      - master # Triggers on push to either main or master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 🟢 Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 📦 Install Dependencies
      run: npm install
      
    - name: 🏗️ Build Project
      # We pass the Supabase env vars from GitHub Secrets so Vite bundles them
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      run: npm run build
      
    - name: 🚀 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        timeout: 100000 
        state-name: .gharwaala-sync-state.json
        local-dir: ./dist/ # Uploads only the compiled Vite code
        server-dir: ./ # Target directory on Hostinger
