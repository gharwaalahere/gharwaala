name: Deploy to Hostinger FTP

on:
  push:
    branches:
      - main  # Set this to your main deployment branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build
        env:
          # We pass the Github Secrets so Vite can bake them into the dist/ code
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}

      - name: Verify build output
        run: |
          echo "=== Files to deploy ==="
          ls -la ./dist/
          echo "=== HTML files ==="
          find ./dist/ -name "*.html" | head -20

      - name: Sync via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger requires FTPS (FTP over TLS), not plain FTP
          protocol: ftps
          port: 21
          # Increase timeout to 5 minutes to prevent control socket timeouts
          timeout: 300000
          # The local directory we want to upload (Vite outputs to dist/)
          local-dir: ./dist/
          # Deploy directly into public_html on Hostinger
          server-dir: ./public_html/
          # Wipe remote clean before uploading to prevent stale/nested files
          dangerous-clean-slate: true
